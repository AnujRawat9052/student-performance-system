<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Add Student</h1>

        <form action="/add-student" method="POST">

            <label>Student ID</label>
            <input type="text" name="student_id" required>
       
            <label>Name</label>
            <input type="text" name="name" required>

            <label>Attendance</label>
            <input type="number" name="attendance"
                   min="0" max="100" required>

            <label>Study Hours</label>
            <input type="number" name="study_hours"
                   min="0" step="0.5" required>

            <label>Assignment Marks</label>
            <input type="number" name="assignment_marks"
                   min="0" max="100" required>

            <label>Internal Marks</label>
            <input type="number" name="internal_marks"
                   min="0" max="100" required>

            <label>Practical Marks</label>
            <input type="number" name="practical_marks"
                   min="0" max="100" required>

            <label>Previous Marks</label>
            <input type="number" name="previous_marks"
                   min="0" max="100" required>

            <button type="submit">Add Student</button>

        </form>

        <br>

        <a href="/">Back to Home</a>

    </div>

</body>
</html>
